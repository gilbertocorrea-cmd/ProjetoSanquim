spring.application.name=projetoSanquim

# Conexao com MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sanquim
spring.datasource.username=sanquim_app
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway acompanha o esquema somente no perfil prod.
spring.flyway.enabled=false
